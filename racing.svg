<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0020"/>
      <stop offset="100%" stop-color="#1a0040"/>
    </linearGradient>
    <!-- Road gradient -->
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1c2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
    <!-- Trophy glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Car glow -->
    <filter id="carGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Flash filter for hit effect -->
    <filter id="hitFlash">
      <feFlood flood-color="#ff4400" result="color"/>
      <feComposite in="color" in2="SourceGraphic" operator="in" result="colored"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="colored"/></feMerge>
    </filter>
    <!-- Trophy gradient -->
    <linearGradient id="trophyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
  </defs>

  <!-- Background sky -->
  <rect width="900" height="160" fill="url(#skyGrad)"/>

  <!-- Stars (static) -->
  <circle cx="50"  cy="25" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="120" cy="15" r="2" fill="white" opacity="0.6"/>
  <circle cx="200" cy="40" r="1.5" fill="white" opacity="0.9"/>
  <circle cx="300" cy="20" r="2" fill="white" opacity="0.7"/>
  <circle cx="400" cy="15" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="500" cy="38" r="2" fill="white" opacity="0.8"/>
  <circle cx="600" cy="22" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="700" cy="17" r="2.5" fill="white" opacity="0.9"/>
  <circle cx="800" cy="25" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="850" cy="42" r="2" fill="white" opacity="0.5"/>
  <circle cx="75"  cy="60" r="1.2" fill="#a0d0ff" opacity="0.6"/>
  <circle cx="250" cy="75" r="1.2" fill="#a0d0ff" opacity="0.5"/>
  <circle cx="450" cy="58" r="1.2" fill="#a0d0ff" opacity="0.7"/>
  <circle cx="650" cy="63" r="1.2" fill="#a0d0ff" opacity="0.6"/>
  
  <!-- Planet -->
  <circle cx="800" cy="40" r="20" fill="#e0e0ff" opacity="0.8" filter="url(#glow)"/>
  <circle cx="805" cy="35" r="5" fill="#c0c0e0" opacity="0.5"/>
  <circle cx="790" cy="45" r="3" fill="#c0c0e0" opacity="0.5"/>
  <circle cx="795" cy="30" r="4" fill="#c0c0e0" opacity="0.5"/>

  <!-- Road surface -->
  <rect x="0" y="110" width="900" height="50" fill="url(#roadGrad)"/>
  <!-- Road edges -->
  <rect x="0" y="108" width="900" height="3" fill="#6A5ACD" opacity="0.8"/>
  <rect x="0" y="155" width="900" height="3" fill="#333"/>

  <!-- Road dashes (moving, simulated with animation groups) -->
  <g id="roadMarks">
    <rect x="0"   y="131" width="60" height="4" rx="2" fill="#444"/>
    <rect x="90"  y="131" width="60" height="4" rx="2" fill="#444"/>
    <rect x="180" y="131" width="60" height="4" rx="2" fill="#444"/>
    <rect x="270" y="131" width="60" height="4" rx="2" fill="#444"/>
    <rect x="360" y="131" width="60" height="4" rx="2" fill="#444"/>
    <rect x="450" y="131" width="60" height="4" rx="2" fill="#444"/>
    <rect x="540" y="131" width="60" height="4" rx="2" fill="#444"/>
    <rect x="630" y="131" width="60" height="4" rx="2" fill="#444"/>
    <rect x="720" y="131" width="60" height="4" rx="2" fill="#444"/>
    <rect x="810" y="131" width="60" height="4" rx="2" fill="#444"/>
    <animateTransform attributeName="transform" type="translate" from="0,0" to="-90,0" dur="1.5s" repeatCount="indefinite"/>
  </g>

  <!-- FINISH LINE (at x=830) -->
  <g id="finishLine">
    <!-- Checker pattern -->
    <rect x="840" y="108" width="14" height="50" fill="white"/>
    <rect x="840" y="108" width="7"  height="12" fill="black"/>
    <rect x="847" y="120" width="7"  height="12" fill="black"/>
    <rect x="840" y="132" width="7"  height="12" fill="black"/>
    <rect x="847" y="144" width="7"  height="12" fill="black"/>
    <text x="854" y="100" font-family="monospace" font-size="11" fill="#FFD700" font-weight="bold" text-anchor="middle">FINISH</text>
  </g>

  <!-- ===================== EXPLOSION PARTICLES ===================== -->
  <!-- Hit 1 explosion at ~x=280, t=3.5s -->
  <g opacity="0">
    <circle cx="280" cy="115" r="15" fill="#ff4400" filter="url(#glow)"/>
    <circle cx="270" cy="105" r="10" fill="#ffaa00"/>
    <circle cx="295" cy="110" r="12" fill="#ff3300"/>
    <circle cx="260" cy="125" r="8" fill="#ffdd00"/>
    <circle cx="300" cy="125" r="10" fill="#ff6600"/>
    <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.33;0.35;0.42" dur="10s" repeatCount="indefinite"/>
  </g>
  <!-- Hit 2 explosion at ~x=520, t=6s -->
  <g opacity="0">
    <circle cx="520" cy="115" r="15" fill="#ff4400" filter="url(#glow)"/>
    <circle cx="505" cy="105" r="10" fill="#ffaa00"/>
    <circle cx="535" cy="110" r="12" fill="#ff3300"/>
    <circle cx="500" cy="125" r="8" fill="#ffdd00"/>
    <circle cx="540" cy="125" r="10" fill="#ff6600"/>
    <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.55;0.57;0.64" dur="10s" repeatCount="indefinite"/>
  </g>

  <!-- ===================== SPACESHIP 1 ===================== -->
  <!-- Flies in from top-right, attacks car around x=280, retreats -->
  <g id="spaceship1" opacity="1">
    <animateTransform attributeName="transform" type="translate"
      values="-30,0; 230,-30; 230,-10; 160,-60; -30,0"
      keyTimes="0; 0.3; 0.36; 0.44; 0.6"
      dur="10s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.3 0 0.7 1; 0.3 0 0.7 1; 0.3 0 0.7 1; 0.3 0 0.7 1"/>
    <!-- UFO saucer body -->
    <ellipse cx="0" cy="0" rx="22" ry="8" fill="#8B5CF6"/>
    <ellipse cx="0" cy="-4" rx="12" ry="6" fill="#A78BFA"/>
    <!-- Cockpit dome -->
    <ellipse cx="0" cy="-8" rx="6" ry="4" fill="#38BDF8" opacity="0.9"/>
    <!-- Lights -->
    <circle cx="-14" cy="1" r="2" fill="#FFD700">
      <animate attributeName="opacity" values="1;0.3;1" dur="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-7"  cy="4" r="2" fill="#FF6B6B">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0"   cy="5" r="2" fill="#FFD700">
      <animate attributeName="opacity" values="1;0.3;1" dur="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="7"   cy="4" r="2" fill="#FF6B6B">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="14"  cy="1" r="2" fill="#FFD700">
      <animate attributeName="opacity" values="1;0.3;1" dur="0.4s" repeatCount="indefinite"/>
    </circle>
    <!-- Laser beam (fires down when attacking) -->
    <rect x="-2" y="5" width="4" height="175" fill="#FF4444" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0.9;0" keyTimes="0;0.31;0.33;0.36;0.4" dur="10s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ===================== SPACESHIP 2 ===================== -->
  <!-- Attacks from top, second hit -->
  <g id="spaceship2" opacity="1">
    <animateTransform attributeName="transform" type="translate"
      values="900,0; 520,-25; 520,-5; 420,-55; 900,0"
      keyTimes="0; 0.52; 0.58; 0.66; 0.78"
      dur="10s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.3 0 0.7 1; 0.3 0 0.7 1; 0.3 0 0.7 1; 0.3 0 0.7 1"/>
    <!-- UFO saucer body -->
    <ellipse cx="0" cy="0" rx="22" ry="8" fill="#EC4899"/>
    <ellipse cx="0" cy="-4" rx="12" ry="6" fill="#F472B6"/>
    <!-- Cockpit dome -->
    <ellipse cx="0" cy="-8" rx="6" ry="4" fill="#7DD3FC" opacity="0.9"/>
    <!-- Lights -->
    <circle cx="-14" cy="1" r="2" fill="#FFD700">
      <animate attributeName="opacity" values="1;0;1" dur="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-7"  cy="4" r="2" fill="#FF6B6B">
      <animate attributeName="opacity" values="0;1;0" dur="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0"   cy="5" r="2" fill="#FFD700">
      <animate attributeName="opacity" values="1;0;1" dur="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="7"   cy="4" r="2" fill="#FF6B6B">
      <animate attributeName="opacity" values="0;1;0" dur="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="14"  cy="1" r="2" fill="#FFD700">
      <animate attributeName="opacity" values="1;0;1" dur="0.5s" repeatCount="indefinite"/>
    </circle>
    <!-- Laser beam -->
    <rect x="-2" y="5" width="4" height="175" fill="#FF00FF" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0.9;0" keyTimes="0;0.53;0.55;0.58;0.62" dur="10s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ===================== RACING CAR ===================== -->
  <g id="raceCar" filter="url(#carGlow)">
    <!-- Car moves from left (-80) to finish line (840) -->
    <animateTransform attributeName="transform" type="translate"
      values="-80,0; 780,0; 830,0"
      keyTimes="0; 0.82; 1"
      dur="10s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.2 0 0.8 1; 0.2 0 0.8 1"/>

    <!-- Speed lines (disappear near finish) -->
    <line x1="-65" y1="115" x2="-95" y2="115" stroke="#6A5ACD" stroke-width="1.5" opacity="0.6"/>
    <line x1="-75" y1="119" x2="-105" y2="119" stroke="#A78BFA" stroke-width="1" opacity="0.4"/>
    <line x1="-60" y1="123" x2="-90" y2="123" stroke="#6A5ACD" stroke-width="1.5" opacity="0.6"/>

    <!-- Exhaust fire (rear) -->
    <ellipse cx="-45" cy="120" rx="10" ry="5" fill="#FF6600" opacity="0.7">
      <animate attributeName="rx" values="10;14;8;12;10" dur="0.15s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="-55" cy="120" rx="7" ry="4" fill="#FFAA00" opacity="0.6">
      <animate attributeName="rx" values="7;10;5;9;7" dur="0.2s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Rear wing -->
    <rect x="-35" y="103" width="16" height="4" rx="1" fill="#7C3AED"/>
    <rect x="-30" y="107" width="4" height="10" fill="#5B21B6"/>
    <rect x="-22" y="107" width="4" height="10" fill="#5B21B6"/>

    <!-- Car body - main (low, sleek F1 style) -->
    <rect x="-35" y="112" width="70" height="15" rx="4" fill="#6A5ACD"/>
    <!-- Car nose -->
    <polygon points="30,115 30,126 55,123" fill="#8B5CF6"/>
    
    <!-- Front wing -->
    <rect x="35" y="123" width="22" height="4" rx="1" fill="#7C3AED"/>

    <!-- Cockpit/canopy -->
    <ellipse cx="-5" cy="111" rx="16" ry="7" fill="#38BDF8" opacity="0.85"/>
    <!-- Driver helmet -->
    <circle cx="-5" cy="108" r="5" fill="#FFD700"/>
    <circle cx="-3" cy="108" r="3" fill="#FF6B35"/>
    <!-- Car number -->
    <text x="-15" y="124" font-family="monospace" font-size="9" fill="white" font-weight="bold">01</text>
    
    <!-- Car top airbox/fin -->
    <polygon points="-12,110 -15,100 -5,100 -5,110" fill="#A78BFA"/>

    <!-- Wheels (Just 2 main wheels for side profile) -->
    <!-- Front wheel -->
    <circle cx="28" cy="127" r="10" fill="#111"/>
    <circle cx="28" cy="127" r="6" fill="#333"/>
    <circle cx="28" cy="127" r="3" fill="#6A5ACD">
      <animateTransform attributeName="transform" type="rotate" from="0,28,127" to="360,28,127" dur="0.2s" repeatCount="indefinite"/>
    </circle>
    <!-- Rear wheel -->
    <circle cx="-22" cy="127"  r="11" fill="#111"/>
    <circle cx="-22" cy="127"  r="7" fill="#333"/>
    <circle cx="-22" cy="127"  r="3.5" fill="#6A5ACD">
      <animateTransform attributeName="transform" type="rotate" from="0,-22,127" to="360,-22,127" dur="0.2s" repeatCount="indefinite"/>
    </circle>

    <!-- Hit damage flash (appears at hit timings) -->
    <rect x="-40" y="100" width="100" height="35" rx="4" fill="#FF4400" opacity="0">
      <animate attributeName="opacity"
        values="0;0;0.5;0;0;0;0.5;0;0"
        keyTimes="0;0.32;0.34;0.38;0.54;0.56;0.58;0.62;1"
        dur="10s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ===================== TROPHY (appears after finish) ===================== -->
  <g id="trophy" filter="url(#glow)" opacity="0">
    <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.84;0.86;0.88;0.98;1" dur="10s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate"
      values="830,160; 830,0; 830,0; 830,-10; 830,-10; 830,160"
      keyTimes="0;0.84;0.86;0.9;0.98;1"
      dur="10s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.3 0 0.7 1; 0.3 0 0.7 1; 0.3 0 0.7 1; 0.3 0 0.7 1; 0.3 0 0.7 1"/>

    <!-- Trophy body -->
    <ellipse cx="0" cy="72" rx="20" ry="5" fill="#8B6914" opacity="0.8"/>
    <rect x="-12" y="60" width="24" height="15" rx="2" fill="#B8860B"/>
    <rect x="-6"  y="50" width="12" height="12" rx="1" fill="#B8860B"/>
    <!-- Cup -->
    <path d="M -18 20 Q -22 40 -14 48 L 14 48 Q 22 40 18 20 Z" fill="url(#trophyGrad)"/>
    <!-- Handles -->
    <path d="M -18 25 Q -35 30 -18 38" fill="none" stroke="#FFD700" stroke-width="3"/>
    <path d="M  18 25 Q  35 30  18 38" fill="none" stroke="#FFD700" stroke-width="3"/>
    <!-- Star on cup -->
    <text x="-6" y="40" font-size="14" fill="#FFF8DC">★</text>
    <!-- Winner text -->
    <text x="0" y="10" font-family="'Arial', sans-serif" font-size="14" fill="#FFD700" font-weight="bold" text-anchor="middle">WINNER!</text>
    <!-- Confetti particles -->
    <circle cx="-30" cy="30" r="3" fill="#FF6B6B" opacity="0.9">
      <animate attributeName="cy" values="30;80;30" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="35" cy="20" r="2" fill="#6EE7B7" opacity="0.9">
      <animate attributeName="cy" values="20;75;20" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-45" cy="45" r="2" fill="#FCD34D" opacity="0.9">
      <animate attributeName="cy" values="45;95;45" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="35" r="3" fill="#818CF8" opacity="0.9">
      <animate attributeName="cy" values="35;85;35" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Title text -->
  <text x="10" y="22" font-family="'Arial', sans-serif" font-size="13" fill="#A78BFA" font-weight="bold">🏁 Contribution Race</text>
</svg>
