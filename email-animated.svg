<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="60" height="60">
  <defs>
    <linearGradient id="emailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA4335" />
      <stop offset="100%" stop-color="#B31412" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#EA4335" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Group animation to sync everything together -->
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="2s" repeatCount="indefinite" />
    
    <!-- Envelope Base -->
    <rect x="15" y="30" width="70" height="45" rx="5" fill="url(#emailGrad)" />
    
    <!-- White paper sticking out slightly -->
    <path d="M 25 30 L 75 30 L 75 25 Q 75 20 70 20 L 30 20 Q 25 20 25 25 Z" fill="#FFF" opacity="0.8">
      <animate attributeName="d" values="M 25 30 L 75 30 L 75 25 Q 75 20 70 20 L 30 20 Q 25 20 25 25 Z; M 25 30 L 75 30 L 75 15 Q 75 10 70 10 L 30 10 Q 25 10 25 15 Z; M 25 30 L 75 30 L 75 25 Q 75 20 70 20 L 30 20 Q 25 20 25 25 Z" dur="2s" repeatCount="indefinite" />
    </path>

    <!-- Envelope Flap -->
    <path d="M 15 35 L 50 60 L 85 35" fill="none" stroke="#FFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Envelope Bottom Lines -->
    <path d="M 15 75 L 40 55 M 85 75 L 60 55" fill="none" stroke="#FFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
  </g>
</svg>
